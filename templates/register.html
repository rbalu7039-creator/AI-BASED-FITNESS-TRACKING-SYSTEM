<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Create Account | FitAI Pulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="../static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card auth-card p-4 p-md-5" style="max-width: 640px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a href="/" class="d-flex align-items-center gap-2 text-decoration-none">
                    <div class="brand-icon-box">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <div>
                        <div class="brand-title" style="color: var(--text-primary);">FitAI Pulse</div>
                        <div class="brand-subtitle">AI Fitness System</div>
                    </div>
                </a>
                <button class="btn-glass py-1 px-3" data-action="toggle-theme" type="button">
                    <i class="fa-solid fa-sun text-warning"></i>
                </button>
            </div>

            <h3 class="fw-bolder mb-1">Create Your Fitness Profile</h3>
            <p class="text-secondary small mb-4">Complete your biometric baseline so our AI engine can calibrate your daily targets</p>

            <form id="registerForm" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="regFullName" class="form-label-custom">Full Name</label>
                        <input type="text" id="regFullName" class="form-control form-control-glass" placeholder="e.g., Rohan Deshmukh" required minlength="2">
                    </div>

                    <div class="col-md-6">
                        <label for="regEmail" class="form-label-custom">Email Address</label>
                        <input type="email" id="regEmail" class="form-control form-control-glass" placeholder="rohan@example.com" required>
                    </div>

                    <div class="col-md-6">
                        <label for="regPassword" class="form-label-custom">Password (min 6 chars)</label>
                        <div class="password-toggle-wrapper">
                            <input type="password" id="regPassword" class="form-control form-control-glass pe-5" placeholder="Create strong password" required minlength="6">
                            <button type="button" class="password-toggle-btn" data-toggle-password="regPassword" aria-label="Toggle password visibility">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="col-md-3 col-6">
                        <label for="regAge" class="form-label-custom">Age (Years)</label>
                        <input type="number" id="regAge" class="form-control form-control-glass" placeholder="22" min="10" max="120" required>
                    </div>

                    <div class="col-md-3 col-6">
                        <label for="regGender" class="form-label-custom">Gender</label>
                        <select id="regGender" class="form-select form-select-glass" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-6">
                        <label for="regHeight" class="form-label-custom">Height (cm)</label>
                        <input type="number" step="0.1" id="regHeight" class="form-control form-control-glass" placeholder="174" min="50" max="280" required>
                    </div>

                    <div class="col-md-4 col-6">
                        <label for="regWeight" class="form-label-custom">Weight (kg)</label>
                        <input type="number" step="0.1" id="regWeight" class="form-control form-control-glass" placeholder="70.5" min="20" max="350" required>
                    </div>

                    <div class="col-md-4">
                        <label for="regGoal" class="form-label-custom">Primary Fitness Goal</label>
                        <select id="regGoal" class="form-select form-select-glass" required>
                            <option value="Weight Loss">Weight Loss</option>
                            <option value="Muscle Gain">Muscle Gain</option>
                            <option value="General Fitness">General Fitness</option>
                            <option value="Improve Endurance">Improve Endurance</option>
                            <option value="Maintain Weight">Maintain Weight</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-brand w-100 py-2 fs-6 mt-4 mb-3">
                    <i class="fa-solid fa-user-check"></i> Complete Registration
                </button>
            </form>

            <div class="text-center small text-secondary mt-2">
                Already registered?
                <a href="/login" class="text-info fw-semibold text-decoration-none ms-1">Sign In Here</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="../static/js/main.js"></script>
</body>
</html>
