<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Sign In | FitAI Pulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="../static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card auth-card p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a href="/" class="d-flex align-items-center gap-2 text-decoration-none">
                    <div class="brand-icon-box">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <div>
                        <div class="brand-title" style="color: var(--text-primary);">FitAI Pulse</div>
                        <div class="brand-subtitle">AI Fitness System</div>
                    </div>
                </a>
                <button class="btn-glass py-1 px-3" data-action="toggle-theme" type="button">
                    <i class="fa-solid fa-sun text-warning"></i>
                </button>
            </div>

            <h3 class="fw-bolder mb-1">Welcome Back</h3>
            <p class="text-secondary small mb-4">Sign in to access your personalized fitness dashboard &amp; AI coach</p>

            <!-- Quick Demo Login Banner for Viva Demonstration -->
            <div class="p-3 rounded-3 mb-4 d-flex justify-content-between align-items-center" style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3);">
                <div class="small">
                    <div class="fw-bold text-success"><i class="fa-solid fa-flask me-1"></i>30-Day Pre-Loaded Demo Account</div>
                    <div class="text-secondary" style="font-size: 0.78rem;">demo@fitai.com &bull; Demo@1234</div>
                </div>
                <button type="button" id="fillDemoBtn" class="btn btn-sm btn-brand py-1 px-3">
                    Auto-Fill
                </button>
            </div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label-custom">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control form-control-glass" placeholder="name@example.com" required>
                </div>

                <div class="mb-4">
                    <label for="loginPassword" class="form-label-custom">Password</label>
                    <div class="password-toggle-wrapper">
                        <input type="password" id="loginPassword" class="form-control form-control-glass pe-5" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle-btn" data-toggle-password="loginPassword" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-brand w-100 py-2 fs-6 mb-3">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </form>

            <div class="text-center small text-secondary mt-3">
                Don't have an account yet?
                <a href="/register" class="text-info fw-semibold text-decoration-none ms-1">Create Account</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="../static/js/main.js"></script>
</body>
</html>
